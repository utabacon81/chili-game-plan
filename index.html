<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chili Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E1C1A; --panel:#272421; --line:#3A3632; --text:#F4EFE8; --muted:#BDB4A9;
    --accent:#F08A3C; --done:#7FB5A8;
    --beans:#C98B5A; --chili:#E06C5A; --serve:#E5B94E; --all:#9DB4D6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
  .brand{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:3px;text-transform:uppercase;font-size:14px;color:var(--accent)}
  .tools{display:flex;gap:8px}
  .chip-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font:500 14px Inter,sans-serif;min-height:40px;cursor:pointer}
  .chip-btn:hover{border-color:var(--muted)}
  .timeline{display:flex;gap:6px;overflow-x:auto;max-width:720px;margin:10px auto 0;padding-bottom:4px;scrollbar-width:none}
  .timeline::-webkit-scrollbar{display:none}
  .tl{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 10px;font:600 14px Oswald,sans-serif;letter-spacing:.5px;min-height:40px;cursor:pointer;position:relative}
  .tl.cur{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .tl.complete:not(.cur){color:var(--done);border-color:#3f5a53}
  main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px 16px 120px}
  .when{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .time{font-family:Oswald,sans-serif;font-weight:700;font-size:64px;line-height:1;color:var(--accent)}
  .count{color:var(--muted);font-size:15px}
  .headline{margin:8px 0 4px;font-size:20px;font-weight:600;line-height:1.35}
  .progress{height:6px;background:var(--line);border-radius:3px;margin:16px 0 20px;overflow:hidden}
  .progress>div{height:100%;background:var(--done);transition:width .2s}
  .group{margin-top:22px}
  .tag{display:inline-flex;align-items:center;gap:8px;font:600 13px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .tag i{width:10px;height:10px;border-radius:5px;display:inline-block}
  .task{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
  .task input{appearance:none;-webkit-appearance:none;flex:0 0 28px;width:28px;height:28px;margin:0;border:2px solid var(--muted);border-radius:7px;display:grid;place-content:center;cursor:pointer;background:transparent}
  .task input:checked{background:var(--done);border-color:var(--done)}
  .task input:checked::after{content:"";width:12px;height:7px;border-left:3px solid #1E1C1A;border-bottom:3px solid #1E1C1A;transform:translateY(-2px) rotate(-45deg)}
  .task input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .task .t{font-size:17px;font-weight:600;line-height:1.35}
  .task .d{font-size:15px;color:var(--muted);line-height:1.45;margin-top:4px}
  .task.checked .t,.task.checked .d{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
  .note{margin-top:22px;border:1px dashed #5a4a3c;border-radius:12px;padding:12px 14px;color:#E9CDB4;font-size:15px;line-height:1.45}
  .note b{color:var(--accent)}
  .start{margin-top:22px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--accent);background:none;color:var(--accent);font:600 18px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px calc(16px + env(safe-area-inset-bottom))}
  .navin{display:flex;gap:10px;max-width:720px;margin:0 auto}
  .nb{flex:1;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 18px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  .nb.next{flex:2;background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .nb:disabled{opacity:.35;cursor:default}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal.open{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
  .box p{margin:0 0 16px;line-height:1.45}
  .box .row{display:flex;gap:10px}
  .box button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);font:600 16px Inter,sans-serif;cursor:pointer}
  .box button.danger{background:var(--chili);border-color:var(--chili);color:#1E1C1A}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Chili Night</div>
    <div class="tools">
      <button class="chip-btn" id="nowBtn" type="button">Jump to now</button>
      <button class="chip-btn" id="resetBtn" type="button">Reset</button>
    </div>
  </div>
  <div class="timeline" id="timeline" role="tablist" aria-label="Time blocks"></div>
</header>

<main id="main" aria-live="polite"></main>

<nav>
  <div class="navin">
    <button class="nb" id="prev" type="button">Prev</button>
    <button class="nb next" id="next" type="button">Next</button>
  </div>
</nav>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtext">
  <div class="box">
    <p id="mtext">Clear every checkbox, stop the clock and go back to the first step?</p>
    <div class="row">
      <button type="button" id="mCancel">Cancel</button>
      <button type="button" class="danger" id="mOk">Reset</button>
    </div>
  </div>
</div>

<script>
const DISH = {
  beans:{label:"Beans", color:"var(--beans)"},
  chili:{label:"Chili", color:"var(--chili)"},
  serve:{label:"Garnish and serve", color:"var(--serve)"},
  all:{label:"Setup", color:"var(--all)"}
};

/* off = minutes after you start the bean boil. null = before the clock starts. */
const BLOCKS = [
  { label:"Night before", off:null, headline:"Brine the beans. 8 to 12 hours.",
    groups:[
      ["beans",[
        ["Weigh out 12 oz of the Fresh Chili Mix Beans","About a third of the 2 lb bag. Seal the rest airtight."],
        ["Pick through for stones and shriveled beans, then rinse",""],
        ["Dissolve 2 tbsp kosher salt in 2 quarts water","The salt brine gives softer skins and more even cooking across the three beans."],
        ["Add the beans and soak at room temperature 8 to 12 hours","Past 12 hours, move them to the fridge."]
      ]]
    ]},
  { label:"Day of", off:null, headline:"Pull everything before you light a burner. Tap Start when the bean pot goes on.",
    groups:[
      ["all",[
        ["Set out a pot for the beans and a large Dutch oven for the chili",""],
        ["Have on hand: 1 1/2 cups beer, 24 oz crushed tomatoes, 24 oz diced tomatoes","The extra 1/2 cup of beer covers the added beans. Stock works for that 1/2 cup too."]
      ]],
      ["beans",[
        ["Halve an onion and grab 1 bay leaf","For the bean pot."]
      ]]
    ],
    startBtn:true },
  { label:"0:00", off:0, headline:"Hard boil the beans. Full rolling boil, 10 minutes minimum.",
    groups:[
      ["beans",[
        ["Drain and rinse the brined beans",""],
        ["Cover with water by 2 inches. Add the half onion, bay leaf and 1 tsp kosher salt",""],
        ["Bring to a full rolling boil and hold it there 10 minutes","This destroys the lectin in the red beans. Don't skip it or shorten it."]
      ]]
    ]},
  { label:"0:10", off:10, headline:"Beans to a simmer. Knock out the cutting board work.",
    groups:[
      ["beans",[
        ["Drop to a gentle simmer, lid partly on","Bubbles barely breaking. A hard boil splits the skins."]
      ]],
      ["chili",[
        ["Cut 6 slices thick-cut bacon into 1/2-inch pieces",""],
        ["Finely chop 4 cloves garlic and 2 medium onions",""],
        ["Chop 1 red and 1 yellow bell pepper",""],
        ["Mix the spices in a small bowl","3 tbsp chili powder, 1 tbsp cumin, 1 tbsp chipotle chili powder, 2 tsp dried oregano, 1 tbsp smoked paprika."]
      ]],
      ["serve",[
        ["Slice scallions, shred Cheddar, cut lime wedges","Leave in the fridge."]
      ]]
    ]},
  { label:"0:40", off:40, headline:"Render the bacon. Taste a bean.",
    groups:[
      ["chili",[
        ["Cook the bacon in the Dutch oven over medium until lightly crisp","About 8 minutes."]
      ]],
      ["beans",[
        ["Taste a pinto and a red bean","Still chalky is fine here. Most fresh beans land at 45 to 75 minutes."]
      ]]
    ]},
  { label:"0:48", off:48, headline:"Aromatics and spices.",
    groups:[
      ["chili",[
        ["Add the onions, peppers, garlic and spice mix to the bacon",""],
        ["Season with 1 1/2 tsp kosher salt and 1 tsp black pepper","Starting amount. You'll correct at the end."],
        ["Cook until the vegetables are tender, about 8 minutes",""]
      ]]
    ]},
  { label:"0:56", off:56, headline:"Brown the meat.",
    groups:[
      ["chili",[
        ["Add 1 lb 85% ground beef and break it up",""],
        ["When it starts to brown, add 1 lb ground pork","Cook until no pink remains, about 4 minutes."]
      ]],
      ["beans",[
        ["Check the beans again","Done when creamy all the way through but still holding their shape."]
      ]]
    ]},
  { label:"1:05", off:65, headline:"Beans done? Drain them and save the liquid.",
    groups:[
      ["beans",[
        ["Confirm all three beans are tender","Not there yet? Pull the meat off the heat and keep simmering the beans. Never add underdone beans to the tomatoes."],
        ["Fish out the onion and bay leaf",""],
        ["Ladle off 1/2 cup cooking liquid, then drain","The bean liquid is for loosening the chili later."]
      ]]
    ]},
  { label:"1:10", off:70, headline:"Build the chili and start the long simmer.",
    groups:[
      ["chili",[
        ["Stir in the 1 1/2 cups beer and the cooked beans",""],
        ["Add the crushed and diced tomatoes with their juice",""],
        ["Bring up to a bubble, then drop to low","1 1/2 hours from here."]
      ]]
    ]},
  { label:"1:40", off:100, headline:"Stir and check.",
    groups:[
      ["chili",[
        ["Stir from the bottom","More beans means more starch on the bottom of the pot."],
        ["Too tight? Loosen with some of the reserved bean liquid",""]
      ]]
    ]},
  { label:"2:10", off:130, headline:"Stir and check again.",
    groups:[
      ["chili",[
        ["Stir from the bottom",""],
        ["Taste for heat","Want more? Add a pinch of chipotle now so it has time to bloom."]
      ]]
    ]},
  { label:"2:40", off:160, headline:"Season and serve.",
    groups:[
      ["chili",[
        ["Taste and correct the salt","Expect to add more than the canned version needs, since these beans brought none with them."],
        ["Adjust the body with the last of the bean liquid if needed",""]
      ]],
      ["serve",[
        ["Ladle up with lime wedges, sour cream, Cheddar and scallions",""]
      ]]
    ]}
];

const KEY = "chili-plan-2026-11-16-v1";
let state = { idx:0, done:{}, startAt:null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s.idx === "number") state = Object.assign(state, s); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function ids(b){ const out=[]; BLOCKS[b].groups.forEach((g,gi)=>g[1].forEach((t,ti)=>out.push(b+"-"+gi+"-"+ti))); return out; }
function isComplete(b){ const a=ids(b); return a.every(id=>state.done[id]); }

function clock(off){
  const d = new Date(state.startAt + off*60000);
  let h = d.getHours(), m = d.getMinutes(), ap = h>=12 ? "pm" : "am";
  h = h%12 || 12;
  return h + ":" + String(m).padStart(2,"0") + ap;
}
function tabLabel(b){ return (b.off!==null && state.startAt) ? clock(b.off) : b.label; }
function bigLabel(b){
  if (b.off===null) return b.label;
  return state.startAt ? clock(b.off) : "+" + b.label;
}

const tl = document.getElementById("timeline");
const main = document.getElementById("main");
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(){
  const b = BLOCKS[state.idx];
  tl.innerHTML = BLOCKS.map((x,i)=>`<button type="button" role="tab" aria-selected="${i===state.idx}" class="tl ${i===state.idx?"cur":""} ${isComplete(i)?"complete":""}" data-i="${i}">${tabLabel(x)}${isComplete(i)?" ✓":""}</button>`).join("");
  const all = ids(state.idx), n = all.filter(id=>state.done[id]).length;
  const sub = (b.off!==null && state.startAt) ? " · +" + b.label + " from start" : "";
  let html = `<div class="when"><div class="time" style="${b.off===null?"font-size:44px":""}">${bigLabel(b)}</div><div class="count">Step ${state.idx+1} of ${BLOCKS.length} · ${n}/${all.length} done${sub}</div></div>
    <div class="headline">${esc(b.headline)}</div>
    <div class="progress"><div style="width:${all.length? n/all.length*100:0}%"></div></div>`;
  b.groups.forEach((g,gi)=>{
    const d = DISH[g[0]];
    html += `<section class="group"><div class="tag" style="color:${d.color}"><i style="background:${d.color}"></i>${d.label}</div>`;
    g[1].forEach((t,ti)=>{
      const id = state.idx+"-"+gi+"-"+ti, on = !!state.done[id];
      html += `<label class="task ${on?"checked":""}"><input type="checkbox" data-id="${id}" ${on?"checked":""}><div><div class="t">${esc(t[0])}</div>${t[1]?`<div class="d">${esc(t[1])}</div>`:""}</div></label>`;
    });
    html += `</section>`;
  });
  if (b.startBtn) {
    html += state.startAt
      ? `<div class="note"><b>Clock started at ${clock(0)}.</b> Times now show the real clock. Reset to clear it.</div>`
      : `<button type="button" class="start" id="startBtn">Start the clock · bean pot is on</button>`;
  }
  if (state.idx < BLOCKS.length-1) {
    const nx = BLOCKS[state.idx+1];
    html += `<div class="note"><b>Up next${nx.off!==null?" at "+tabLabel(nx):": "+nx.label}:</b> ${esc(nx.headline)}</div>`;
  }
  main.innerHTML = html;
  const sb = document.getElementById("startBtn");
  if (sb) sb.onclick = ()=>{ state.startAt = Date.now(); go(state.idx+1); };
  document.getElementById("prev").disabled = state.idx===0;
  const nextBtn = document.getElementById("next");
  nextBtn.disabled = state.idx===BLOCKS.length-1;
  nextBtn.textContent = state.idx===BLOCKS.length-1 ? "Enjoy" : "Next · " + tabLabel(BLOCKS[state.idx+1]);
  document.getElementById("nowBtn").style.display = state.startAt ? "" : "none";
  const cur = tl.querySelector(".cur"); if (cur) cur.scrollIntoView({inline:"center", block:"nearest"});
}

function go(i){ state.idx = Math.max(0, Math.min(BLOCKS.length-1, i)); save(); render(); window.scrollTo(0,0); }

tl.addEventListener("click", e=>{ const t=e.target.closest(".tl"); if(t) go(+t.dataset.i); });
main.addEventListener("change", e=>{
  const c = e.target.closest("input[data-id]"); if(!c) return;
  if (c.checked) state.done[c.dataset.id] = true; else delete state.done[c.dataset.id];
  save(); const y = window.scrollY; render(); window.scrollTo(0,y);
});
document.getElementById("prev").onclick = ()=>go(state.idx-1);
document.getElementById("next").onclick = ()=>go(state.idx+1);
document.getElementById("nowBtn").onclick = ()=>{
  if (!state.startAt) return;
  const el = (Date.now() - state.startAt)/60000;
  let pick = 2;
  BLOCKS.forEach((b,i)=>{ if(b.off!==null && el >= b.off) pick=i; });
  go(pick);
};
const modal = document.getElementById("modal");
document.getElementById("resetBtn").onclick = ()=>modal.classList.add("open");
document.getElementById("mCancel").onclick = ()=>modal.classList.remove("open");
document.getElementById("mOk").onclick = ()=>{ state={idx:0,done:{},startAt:null}; save(); modal.classList.remove("open"); render(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") modal.classList.remove("open"); });

render();
</script>
</body>
</html>
