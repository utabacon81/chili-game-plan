<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chili Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E1C1A; --panel:#272421; --line:#3A3632; --text:#F4EFE8; --muted:#BDB4A9;
    --accent:#F08A3C; --done:#7FB5A8;
    --beans:#C98B5A; --chili:#E06C5A; --serve:#E5B94E; --all:#9DB4D6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
  .brand{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:3px;text-transform:uppercase;font-size:14px;color:var(--accent)}
  .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:420px){ .chip-btn{padding:8px 10px;font-size:13px} .brand{font-size:12px;letter-spacing:2px} }
  .chip-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font:500 14px Inter,sans-serif;min-height:40px;cursor:pointer}
  .chip-btn:hover{border-color:var(--muted)}
  .timeline{display:flex;gap:6px;overflow-x:auto;max-width:720px;margin:10px auto 0;padding-bottom:4px;scrollbar-width:none}
  .timeline::-webkit-scrollbar{display:none}
  .tl{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 10px;font:600 14px Oswald,sans-serif;letter-spacing:.5px;min-height:40px;cursor:pointer;position:relative}
  .tl.cur{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .tl.complete:not(.cur){color:var(--done);border-color:#3f5a53}
  main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px 16px 120px}
  .when{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .time{font-family:Oswald,sans-serif;font-weight:700;font-size:64px;line-height:1;color:var(--accent)}
  .count{color:var(--muted);font-size:15px}
  .headline{margin:8px 0 4px;font-size:20px;font-weight:600;line-height:1.35}
  .progress{height:6px;background:var(--line);border-radius:3px;margin:16px 0 20px;overflow:hidden}
  .progress>div{height:100%;background:var(--done);transition:width .2s}
  .group{margin-top:22px}
  .tag{display:inline-flex;align-items:center;gap:8px;font:600 13px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .tag i{width:10px;height:10px;border-radius:5px;display:inline-block}
  .task{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
  .task input{appearance:none;-webkit-appearance:none;flex:0 0 28px;width:28px;height:28px;margin:0;border:2px solid var(--muted);border-radius:7px;display:grid;place-content:center;cursor:pointer;background:transparent}
  .task input:checked{background:var(--done);border-color:var(--done)}
  .task input:checked::after{content:"";width:12px;height:7px;border-left:3px solid #1E1C1A;border-bottom:3px solid #1E1C1A;transform:translateY(-2px) rotate(-45deg)}
  .task input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .task .t{font-size:17px;font-weight:600;line-height:1.35}
  .task .d{font-size:15px;color:var(--muted);line-height:1.45;margin-top:4px}
  .task.checked .t,.task.checked .d{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
  .note{margin-top:22px;border:1px dashed #5a4a3c;border-radius:12px;padding:12px 14px;color:#E9CDB4;font-size:15px;line-height:1.45}
  .note b{color:var(--accent)}
  .start{margin-top:22px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--accent);background:none;color:var(--accent);font:600 18px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 16px calc(16px + env(safe-area-inset-bottom))}
  .navin{display:flex;gap:10px;max-width:720px;margin:0 auto}
  .nb{flex:1;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 18px Oswald,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  .nb.next{flex:2;background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .nb:disabled{opacity:.35;cursor:default}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal.open{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
  .box p{margin:0 0 16px;line-height:1.45}
  .box .row{display:flex;gap:10px}
  .box button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);font:600 16px Inter,sans-serif;cursor:pointer}
  .box button.danger{background:var(--chili);border-color:var(--chili);color:#1E1C1A}
  .box button.go{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
  .box label{display:block;font:600 13px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .box input[type=time]{width:100%;min-height:52px;margin-bottom:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 22px Inter,sans-serif;padding:0 14px;color-scheme:dark}
  .box .hint{font-size:14px;color:var(--muted);margin:0 0 16px}
  .chip-btn.set{border-color:var(--accent);color:var(--accent)}
  .status{margin-top:16px;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;background:var(--panel);border:1px solid var(--line)}
  .status b{color:var(--accent)}
  .status.late b{color:var(--chili)}
  .status.ok b{color:var(--done)}
  .ings{background:#2c2723;border:1px solid var(--line);border-left:4px solid var(--c,#888);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .ings h4{margin:0 0 6px;font:600 12px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .ings ul{margin:0;padding:0;list-style:none}
  .ings li{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:16px;line-height:1.35;border-top:1px solid #36312c}
  .ings li:first-child{border-top:none}
  .ings .amt{flex:0 0 auto;min-width:92px;font-weight:600;color:var(--text)}
  .ings .nm{flex:1;color:#E9E2D8}
  .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font:600 11px Inter,sans-serif;letter-spacing:.5px;text-transform:uppercase;vertical-align:2px;background:#3f5a53;color:#CFE7E0}
  .gather{margin:6px 0 4px}
  .gather>.ings{border-left-color:var(--accent)}
  .ilist h2{font:600 15px Oswald,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .ilist h2:first-of-type{margin-top:6px}
  .ilist .ings{margin-bottom:0}
  .ilist label.irow{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #36312c;cursor:pointer}
  .ilist label.irow:first-child{border-top:none}
  .ilist label.irow input{appearance:none;-webkit-appearance:none;flex:0 0 24px;width:24px;height:24px;margin:0;border:2px solid var(--muted);border-radius:6px;display:grid;place-content:center;cursor:pointer}
  .ilist label.irow input:checked{background:var(--done);border-color:var(--done)}
  .ilist label.irow input:checked::after{content:"";width:10px;height:6px;border-left:3px solid #1E1C1A;border-bottom:3px solid #1E1C1A;transform:translateY(-2px) rotate(-45deg)}
  .ilist label.irow.have .amt,.ilist label.irow.have .nm{opacity:.45;text-decoration:line-through}
  .ilist .amt{flex:0 0 auto;min-width:104px;font-weight:600}
  .ilist .nm{flex:1;color:#E9E2D8;font-size:16px;line-height:1.35}
  .ilist .sub{color:var(--muted);font-size:13px;display:block;margin-top:2px}
  .ilist .bopts{margin:10px 0 4px}
  .ilist .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ilist .title{font:700 34px Oswald,sans-serif;color:var(--accent);line-height:1.1}
  .ilist .meta{color:var(--muted);font-size:15px}
  .bopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .bopts button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);font:600 18px Oswald,sans-serif;cursor:pointer}
  .bopts button.on{background:var(--accent);border-color:var(--accent);color:#1E1C1A}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Chili Night</div>
    <div class="tools">
      <button class="chip-btn" id="ingBtn" type="button">Ingredients</button>
      <button class="chip-btn" id="batchBtn" type="button">1x batch</button>
      <button class="chip-btn" id="readyBtn" type="button">Ready by</button>
      <button class="chip-btn" id="nowBtn" type="button">Now</button>
      <button class="chip-btn" id="resetBtn" type="button">Reset</button>
    </div>
  </div>
  <div class="timeline" id="timeline" role="tablist" aria-label="Time blocks"></div>
</header>

<main id="main" aria-live="polite"></main>

<nav>
  <div class="navin">
    <button class="nb" id="prev" type="button">Prev</button>
    <button class="nb next" id="next" type="button">Next</button>
  </div>
</nav>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtext">
  <div class="box">
    <p id="mtext">Clear every checkbox, stop the clock and go back to the first step?</p>
    <div class="row">
      <button type="button" id="mCancel">Cancel</button>
      <button type="button" class="danger" id="mOk">Reset</button>
    </div>
  </div>
</div>

<div class="modal" id="rmodal" role="dialog" aria-modal="true" aria-labelledby="rlabel">
  <div class="box">
    <label for="rtime" id="rlabel">Chili ready at</label>
    <input type="time" id="rtime" step="300">
    <p class="hint" id="rhint"></p>
    <div class="row">
      <button type="button" id="rClear">Clear</button>
      <button type="button" class="go" id="rSave">Set</button>
    </div>
  </div>
</div>

<div class="modal" id="bmodal" role="dialog" aria-modal="true" aria-labelledby="blabel">
  <div class="box">
    <label id="blabel">Batch size</label>
    <div class="bopts" id="bopts"></div>
    <p class="hint" id="bhint"></p>
    <div class="row">
      <button type="button" class="go" id="bDone">Done</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Batch scaling
   ============================================================ */
const SCALES = [1, 1.5, 2, 3];
const BASE_SERVINGS = 8;

/* Base (1x) amounts. cons:true scales at 75% past 1x (heat and salt), and you correct at the end. */
const ING = {
  beans:      { q:12,  u:"oz",     n:"TN Bean Man Fresh Chili Mix Beans, dry" },
  brineSalt:  { q:2,   u:"tbsp",   n:"kosher salt, for the brine" },
  brineWater: { q:2,   u:"qt",     n:"water, for the brine" },
  halfOnion:  { q:1,   u:"ea",     n:"onion half, for the bean pot", np:"onion halves, for the bean pot", whole:true },
  bay:        { q:1,   u:"ea",     n:"bay leaf", np:"bay leaves", whole:true },
  beanSalt:   { q:1,   u:"tsp",    n:"kosher salt, for the bean water" },
  bacon:      { q:6,   u:"slices", n:"thick-cut applewood smoked bacon" },
  garlic:     { q:4,   u:"cloves", n:"garlic" },
  onion:      { q:2,   u:"ea",     n:"medium onion", np:"medium onions" },
  redPep:     { q:1,   u:"ea",     n:"red bell pepper", np:"red bell peppers" },
  yelPep:     { q:1,   u:"ea",     n:"yellow bell pepper", np:"yellow bell peppers" },
  chiliP:     { q:3,   u:"tbsp",   n:"chili powder" },
  cumin:      { q:1,   u:"tbsp",   n:"ground cumin" },
  chipotle:   { q:1,   u:"tbsp",   n:"chipotle chili powder", cons:true },
  oregano:    { q:2,   u:"tsp",    n:"dried oregano" },
  paprika:    { q:1,   u:"tbsp",   n:"smoked paprika" },
  salt:       { q:1.5, u:"tsp",    n:"kosher salt, starting amount", cons:true },
  pepper:     { q:1,   u:"tsp",    n:"black pepper" },
  beef:       { q:1,   u:"lb",     n:"85% lean ground beef" },
  pork:       { q:1,   u:"lb",     n:"ground pork" },
  beer:       { q:1.5, u:"cup",    n:"beer (or stock)" },
  crushed:    { q:24,  u:"oz",     n:"crushed tomatoes" },
  diced:      { q:24,  u:"oz",     n:"diced tomatoes, with juice" },
  beanLiquid: { q:0.5, u:"cup",    n:"reserved bean cooking liquid" },
  garnish:    { q:null,            n:"lime wedges, sour cream, Cheddar, scallions" }
};

function frac(x, step){
  const r = Math.round(x/step)*step;
  const w = Math.floor(r + 1e-9), f = +(r - w).toFixed(3);
  const F = {0.25:"1/4", 0.5:"1/2", 0.75:"3/4"}[f] || "";
  return w ? (F ? w + " " + F : String(w)) : (F || "0");
}
function amount(id, k){
  const g = ING[id];
  if (g.q == null) return "to taste";
  const m = g.cons ? 1 + (k-1)*0.75 : k;
  let v = g.q * m;
  switch (g.u) {
    case "tsp":
      if (v >= 3) return amount_tbsp(v/3);
      return frac(v, .25) + " tsp";
    case "tbsp": return amount_tbsp(v);
    case "cup":  return frac(v, .25) + " cup" + (v > 1.01 ? "s" : "");
    case "qt":   return frac(v, .5) + " qt";
    case "lb":   return frac(v, .25) + " lb";
    case "oz": {
      const oz = Math.round(v);
      return oz >= 16 && id === "beans" ? oz + " oz (" + frac(oz/16, .25) + " lb)" : oz + " oz";
    }
    case "slices": return Math.ceil(v) + " slices";
    case "cloves": return Math.ceil(v) + " cloves";
    case "ea": {
      const n = g.whole ? Math.max(1, Math.round(v)) : Math.round(v*2)/2;
      return frac(n, .5);
    }
  }
  return String(v);
}
function amount_tbsp(t){
  if (t >= 8) {
    const quarters = Math.floor(t/4);          /* 4 tbsp = 1/4 cup */
    const rem = Math.round((t - quarters*4)*2)/2;
    return frac(quarters/4, .25) + " cup" + (rem ? " + " + frac(rem, .5) + " tbsp" : "");
  }
  return frac(t, .25) + " tbsp";
}
function ingName(id, k){
  const g = ING[id];
  if (g.u === "ea") { const m = g.cons ? 1+(k-1)*.75 : k; const v = g.q*m; return (g.np && v > 1.01) ? g.np : g.n; }
  return g.n;
}
function A(id){ return amount(id, S.scale); }

/* ============================================================
   Plan, rebuilt for each batch size
   off = minutes after the bean pot goes on. null = before the clock starts.
   Each block: ings = [[id, prepped?]] or [{amt, n, prepped}]
   ============================================================ */
function buildBlocks(k){
  const big = k >= 2;
  const POT  = {1:"6 qt Dutch oven", 1.5:"8 qt Dutch oven", 2:"12 qt stockpot", 3:"16 qt stockpot"}[k];
  const BPOT = {1:4, 1.5:6, 2:8, 3:10}[k];
  const meatBatches = k <= 1.5 ? 1 : Math.ceil(k);

  const boil   = 10 + Math.round(5*(k-1));
  const prep   = 30 + Math.round(12*(k-1));
  const bacon  = 8 + Math.round(4*(k-1));
  const arom   = 8 + Math.round(4*(k-1));
  const meat   = meatBatches > 1 ? 7*meatBatches : 9 + Math.round(4*(k-1));
  const simmer = 90 + Math.round(10*(k-1));
  const beansDone = boil + 55 + Math.round(5*(k-1));

  const tBacon = boil + prep, tArom = tBacon + bacon, tMeat = tArom + arom, baseDone = tMeat + meat;
  const tDrain = beansDone;
  const tBuild = Math.max(baseDone, beansDone + 5);
  const tEnd   = tBuild + simmer;

  const spiceAmts = `${A("chiliP")} chili powder, ${A("cumin")} cumin, ${A("chipotle")} chipotle chili powder, ${A("oregano")} dried oregano, ${A("paprika")} smoked paprika.`;

  return [
    { label:"Night before", off:null, headline:"Brine the beans. 8 to 12 hours.",
      ings:[["beans"],["brineSalt"],["brineWater"]],
      tasks:[
        ["nb-weigh", `Weigh out ${A("beans")} of the Fresh Chili Mix Beans`, k*12 > 32 ? "That's more than one 2 lb bag, so you'll need two." : "One 2 lb bag covers it. Seal the rest airtight."],
        ["nb-pick", "Pick through for stones and shriveled beans, then rinse", ""],
        ["nb-brine", `Dissolve ${A("brineSalt")} kosher salt in ${A("brineWater")} water`, "The salt brine gives softer skins and more even cooking across the three beans."],
        ["nb-soak", "Add the beans and soak at room temperature 8 to 12 hours", (big ? `Use a container that holds at least ${Math.ceil(k*3)} qt, since the beans roughly double. ` : "") + "Past 12 hours, move them to the fridge."]
      ]},
    { label:"Day of", off:null, headline:"Pull everything before you light a burner. Tap Start when the bean pot goes on.",
      ings:[["beer"],["crushed"],["diced"],["halfOnion"],["bay"]],
      tasks:[
        ["do-pots", `Set out ${BPOT===8?"an":"a"} ${BPOT} qt or larger pot for the beans and a ${POT} for the chili`, big ? "Wider is better than taller. If your big pot is a tall stockpot, plan to brown the meat in a large skillet." : ""],
        ["do-cans", `Have on hand: ${A("beer")} beer, ${A("crushed")} crushed tomatoes, ${A("diced")} diced tomatoes`, "Stock works in place of the extra beer."],
        ["do-onion", `Halve ${Math.ceil(+amount("halfOnion",k)/2)===1 ? "an onion" : Math.ceil(+amount("halfOnion",k)/2)+" onions"} and grab ${amount("bay",k)} ${ingName("bay",k)}`, "For the bean pot."]
      ],
      startBtn:true },
    { off:0, headline:"Hard boil the beans. Full rolling boil, 10 minutes minimum.",
      ings:[["beans",true],["halfOnion",true],["bay"],["beanSalt"]],
      tasks:[
        ["b-drain", "Drain and rinse the brined beans", ""],
        ["b-cover", `Cover with water by 2 inches. Add the ${ingName("halfOnion",k).replace(/,.*$/,"")}, ${ingName("bay",k)} and ${A("beanSalt")} kosher salt`, ""],
        ["b-boil", "Bring to a full rolling boil and hold it there 10 minutes", "This destroys the lectin in the red beans. Don't skip it or shorten it." + (k > 1 ? " A bigger pot takes longer to come up. The 10 minutes starts at a full boil." : "")]
      ]},
    { off:boil, headline:"Beans to a simmer. Knock out the cutting board work.",
      ings:[["bacon"],["garlic"],["onion"],["redPep"],["yelPep"],["chiliP"],["cumin"],["chipotle"],["oregano"],["paprika"],["garnish"]],
      tasks:[
        ["s-simmer", "Drop the beans to a gentle simmer, lid partly on", "Bubbles barely breaking. A hard boil splits the skins."],
        ["s-bacon", `Cut ${A("bacon")} bacon into 1/2-inch pieces`, ""],
        ["s-onion", `Finely chop ${A("garlic")} garlic and ${A("onion")} ${ingName("onion",k)}`, ""],
        ["s-pep", `Chop ${A("redPep")} red and ${A("yelPep")} yellow bell ${k > 1 ? "peppers" : "pepper"}`, ""],
        ["s-spice", "Mix the spices in a small bowl", spiceAmts + (k > 1 ? " Chipotle is scaled at 75% so the heat doesn't run away. Add more at the end if you want it." : "")],
        ["s-garnish", "Slice scallions, shred Cheddar, cut lime wedges", "Leave in the fridge."]
      ]},
    { off:tBacon, headline:"Render the bacon. Taste a bean.",
      ings:[["bacon",true]],
      tasks:[
        ["c-bacon", `Cook the bacon in the ${POT.replace(/^\d+(\.\d+)? qt /,"")} over medium until lightly crisp`, `About ${bacon} minutes.` + (big ? " Spread it out. Crowded bacon steams instead of rendering." : "")],
        ["c-taste1", "Taste a pinto and a red bean", "Still chalky is fine here. Most fresh beans land at 45 to 75 minutes."]
      ]},
    { off:tArom, headline:"Aromatics and spices.",
      ings:[["onion",true],["redPep",true],["yelPep",true],["garlic",true],{amt:"1 bowl", n:"spice mix", prepped:true},["salt"],["pepper"]],
      tasks:[
        ["a-add", "Add the onions, peppers, garlic and spice mix to the bacon", ""],
        ["a-season", `Season with ${A("salt")} kosher salt and ${A("pepper")} black pepper`, "Starting amount. You'll correct at the end." + (k > 1 ? " Salt is scaled at 75% since it's easier to add than take away." : "")],
        ["a-cook", "Cook until the vegetables are tender", `About ${arom} minutes.`]
      ]},
    { off:tMeat, headline: meatBatches > 1 ? `Brown the meat in ${meatBatches} batches.` : "Brown the meat.",
      ings:[["beef"],["pork"]],
      tasks: meatBatches > 1 ? [
        ["m-batch", `Brown ${A("beef")} beef and ${A("pork")} pork in ${meatBatches} batches`, `Push the vegetables to one side, or brown in a large skillet and add each batch to the pot. Crowded meat steams and turns gray. About ${meat} minutes total.`],
        ["m-done", "Cook until no pink remains and everything is back in the pot", ""],
      ].concat(tDrain < tMeat ? [] : [["m-beans", "Check the beans again", "Done when creamy all the way through but still holding their shape."]]) : [
        ["m-beef", `Add ${A("beef")} ground beef and break it up`, ""],
        ["m-pork", `When it starts to brown, add ${A("pork")} ground pork`, "Cook until no pink remains, about 4 minutes."],
      ].concat(tDrain < tMeat ? [] : [["m-beans", "Check the beans again", "Done when creamy all the way through but still holding their shape."]])},
    { off:tDrain, headline:"Beans done? Drain them and save the liquid.",
      ings:[{amt:"1 colander", n:"set over a bowl", prepped:false},["beanLiquid"]],
      tasks:[
        ["d-check", "Confirm all three beans are tender", "Not there yet? Pull the meat off the heat and keep simmering the beans. Never add underdone beans to the tomatoes."],
        ["d-fish", `Fish out the ${ingName("halfOnion",k).replace(/,.*$/,"")} and ${ingName("bay",k)}`, ""],
        ["d-drain", `Ladle off ${A("beanLiquid")} cooking liquid, then drain`, "The bean liquid is for loosening the chili later." + (tDrain + 5 < baseDone ? " The base isn't ready yet, so keep the drained beans covered." : "")]
      ]},
    { off:tBuild, headline:"Build the chili and start the long simmer.",
      ings:[["beer"],{amt:amount("beans",k).replace(/ \(.*/,"")+" dry", n:"cooked beans", prepped:true},["crushed"],["diced"]],
      tasks:[
        ["u-beer", `Stir in ${A("beer")} beer and the cooked beans`, ""],
        ["u-tom", `Add ${A("crushed")} crushed and ${A("diced")} diced tomatoes with their juice`, ""],
        ["u-low", "Bring up to a bubble, then drop to low", (k > 1 ? "A full pot takes longer to come back up. Give it 10 to 15 minutes on medium first. " : "") + `${fmtDur(simmer)} from here.`]
      ]},
    { off:tBuild + Math.round(simmer/3), headline:"Stir and check.",
      ings:[["beanLiquid"]],
      tasks:[
        ["k1-stir", "Stir from the bottom", "More beans means more starch on the bottom of the pot."],
        ["k1-loose", "Too tight? Loosen with some of the reserved bean liquid", ""]
      ]},
    { off:tBuild + Math.round(simmer*2/3), headline:"Stir and check again.",
      ings:[["chipotle"]],
      tasks:[
        ["k2-stir", "Stir from the bottom", ""],
        ["k2-heat", "Taste for heat", "Want more? Add a pinch of chipotle now so it has time to bloom."]
      ]},
    { off:tEnd, headline:"Season and serve.",
      ings:[{amt:"as needed", n:"kosher salt", prepped:false},["beanLiquid"],["garnish",true]],
      tasks:[
        ["e-salt", "Taste and correct the salt", "Expect to add more than the canned version needs, since these beans brought none with them."],
        ["e-body", "Adjust the body with the last of the bean liquid if needed", ""],
        ["e-serve", "Ladle up with lime wedges, sour cream, Cheddar and scallions", `Serves about ${Math.round(BASE_SERVINGS*k)}.`]
      ]}
  ];
}

/* ============================================================
   State
   ============================================================ */
const KEY = "chili-plan-2026-11-16-v1";
let S = { idx:0, done:{}, startAt:null, target:null, scale:1, view:"plan", have:{} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s.idx === "number") S = Object.assign(S, s); } catch(e) {}
if (!SCALES.includes(S.scale)) S.scale = 1;
if (!S.have) S.have = {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

let BLOCKS = [], TOTAL = 0;
function rebuild(){
  const all = buildBlocks(S.scale);
  const pre = all.filter(b=>b.off===null), timed = all.filter(b=>b.off!==null).sort((a,b)=>a.off-b.off);
  BLOCKS = pre.concat(timed); TOTAL = timed[timed.length-1].off;
}
const BRINE_MIN = 8*60, BRINE_MAX = 12*60;

function ids(B){ return B.tasks.map(t=>t[0]); }
function isComplete(B){ return ids(B).every(id=>S.done[id]); }

/* ============================================================
   Time
   ============================================================ */
function anchor(){
  if (S.startAt) return S.startAt;
  if (S.target) return S.target - TOTAL*60000;
  return null;
}
function fmt(ms, withDay){
  const d = new Date(ms);
  let h = d.getHours(), m = d.getMinutes(), ap = h>=12 ? "pm" : "am";
  h = h%12 || 12;
  let s = h + ":" + String(m).padStart(2,"0") + ap;
  if (withDay) {
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const d0 = new Date(ms); d0.setHours(0,0,0,0);
    const diff = Math.round((d0 - t0)/86400000);
    s += diff===0 ? " today" : diff===1 ? " tomorrow" : diff===-1 ? " yesterday" : " " + d.toLocaleDateString([], {weekday:"short"});
  }
  return s;
}
function rel(off){ return Math.floor(off/60) + ":" + String(off%60).padStart(2,"0"); }
function fmtDur(m){ m = Math.round(Math.abs(m)); const h = Math.floor(m/60), mm = m%60; return h ? h + " hr" + (mm ? " " + mm + " min" : "") : mm + " min"; }
function tabLabel(B){ return B.off===null ? B.label : (anchor() ? fmt(anchor() + B.off*60000) : rel(B.off)); }
function bigLabel(B){ return B.off===null ? B.label : (anchor() ? fmt(anchor() + B.off*60000) : "+" + rel(B.off)); }

function statusHtml(B){
  const a = anchor(); if (!a) return "";
  if (B.label==="Night before") return `<div class="status">Brine window: <b>${fmt(a-BRINE_MAX*60000,true)}</b> to <b>${fmt(a-BRINE_MIN*60000,true)}</b>. Beans go on to boil at <b>${fmt(a,true)}</b>.</div>`;
  if (!S.startAt) return B.label==="Day of" ? `<div class="status">Put the bean pot on at <b>${fmt(a,true)}</b> to be ready at <b>${fmt(S.target,true)}</b>.</div>` : "";
  if (!S.target) return "";
  const proj = S.startAt + TOTAL*60000, diff = (proj - S.target)/60000;
  if (Math.abs(diff) < 3) return `<div class="status ok">On track for <b>${fmt(S.target)}</b>.</div>`;
  if (diff > 0) return `<div class="status late">Running <b>${fmtDur(diff)} late</b>. Projected ready ${fmt(proj)}. To claw it back, trim the final simmer, but keep at least 1 hour so the beans soak up flavor.</div>`;
  return `<div class="status ok">Running <b>${fmtDur(diff)} early</b>. Projected ready ${fmt(proj)}. Hold on the lowest heat until ${fmt(S.target)}.</div>`;
}

/* ============================================================
   Render
   ============================================================ */
const tl = document.getElementById("timeline"), main = document.getElementById("main");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function gatherHtml(B){
  if (!B.ings || !B.ings.length) return "";
  const rows = B.ings.map(x=>{
    let amt, n, prepped;
    if (Array.isArray(x)) { amt = A(x[0]); n = ingName(x[0], S.scale); prepped = !!x[1]; }
    else { amt = x.amt; n = x.n; prepped = !!x.prepped; }
    return `<li><span class="amt">${esc(amt)}</span><span class="nm">${esc(n)}${prepped ? `<span class="badge">prepped</span>` : ""}</span></li>`;
  }).join("");
  return `<div class="gather"><div class="ings"><h4>Ingredient list for this step</h4><ul>${rows}</ul></div></div>`;
}

/* Full ingredient list for the selected batch, grouped the way you'd shop and set up. */
const GROUPS = [
  ["For the beans", ["beans","brineSalt","halfOnion","bay","beanSalt"]],
  ["Chili base", ["bacon","onion","redPep","yelPep","garlic","beef","pork"]],
  ["Spices and seasoning", ["chiliP","cumin","chipotle","oregano","paprika","salt","pepper"]],
  ["Liquids and tomatoes", ["beer","crushed","diced"]],
  ["To serve", [{n:"lime wedges"},{n:"sour cream"},{n:"shredded Cheddar"},{n:"sliced scallions"}]]
];
const NOTES = {
  halfOnion: k=>`${Math.ceil(+amount("halfOnion",k)/2)} onion${Math.ceil(+amount("halfOnion",k)/2) > 1 ? "s" : ""}, halved`,
  chipotle: k=> k > 1 ? "Scaled at 75%. Add more to taste." : "",
  salt: k=> k > 1 ? "Scaled at 75%. Correct at the end." : "",
  beans: k=> k*12 > 32 ? "Two 2 lb bags" : "One 2 lb bag"
};
function renderIngredients(){
  const k = S.scale;
  tl.style.display = "none"; document.querySelector("nav").style.display = "none";
  const allSalt = ["brineSalt","beanSalt","salt"];
  let h = `<div class="ilist">
    <div class="top2"><div class="title">Ingredient list</div><div class="meta">${k}x batch · serves about ${Math.round(BASE_SERVINGS*k)}</div></div>
    <div class="bopts">${SCALES.map(x=>`<button type="button" class="${x===k?"on":""}" data-k="${x}">${x}x</button>`).join("")}</div>`;
  GROUPS.forEach(([title, items])=>{
    h += `<h2>${title}</h2><div class="ings"><ul style="list-style:none;margin:0;padding:0">`;
    items.forEach(it=>{
      const key = typeof it === "string" ? it : "g-" + it.n;
      const amt = typeof it === "string" ? A(it) : "to taste";
      const nm  = typeof it === "string" ? ingName(it, k) : it.n;
      const note = typeof it === "string" && NOTES[it] ? NOTES[it](k) : "";
      const on = !!S.have[key];
      h += `<li style="border:none;padding:0"><label class="irow ${on?"have":""}"><input type="checkbox" data-have="${esc(key)}" ${on?"checked":""}><span class="amt">${esc(amt)}</span><span class="nm">${esc(nm)}${note ? `<span class="sub">${esc(note)}</span>` : ""}</span></label></li>`;
    });
    h += `</ul></div>`;
  });
  h += `<div class="note"><b>Also needed:</b> ${A("brineWater")} water for the brine, plenty of water for the bean pot, and a colander. The ${A("beanLiquid")} of bean cooking liquid comes from the beans.</div>
    <button type="button" class="start" id="backBtn">Back to the plan</button></div>`;
  main.innerHTML = h;
  document.getElementById("ingBtn").textContent = "Plan";
  const bb = document.getElementById("batchBtn"); bb.textContent = k + "x batch"; bb.classList.toggle("set", k !== 1);
  const rb = document.getElementById("readyBtn"); rb.textContent = S.target ? "Ready " + fmt(S.target) : "Ready by"; rb.classList.toggle("set", !!S.target);
  document.getElementById("nowBtn").style.display = "none";
}

function render(){
  if (S.view === "ings") return renderIngredients();
  tl.style.display = ""; document.querySelector("nav").style.display = "";
  document.getElementById("ingBtn").textContent = "Ingredients";
  const B = BLOCKS[S.idx];
  tl.innerHTML = BLOCKS.map((x,i)=>`<button type="button" role="tab" aria-selected="${i===S.idx}" class="tl ${i===S.idx?"cur":""} ${isComplete(x)?"complete":""}" data-i="${i}">${tabLabel(x)}${isComplete(x)?" ✓":""}</button>`).join("");
  const all = ids(B), n = all.filter(id=>S.done[id]).length;
  const sub = (B.off!==null && anchor()) ? " · +" + rel(B.off) + " from start" : "";
  const batch = S.scale !== 1 ? ` · ${S.scale}x batch` : "";
  let h = `<div class="when"><div class="time" style="${B.off===null?"font-size:44px":""}">${bigLabel(B)}</div><div class="count">Step ${S.idx+1} of ${BLOCKS.length} · ${n}/${all.length} done${sub}${batch}</div></div>
    <div class="headline">${esc(B.headline)}</div>
    ${statusHtml(B)}
    <div class="progress"><div style="width:${all.length ? n/all.length*100 : 0}%"></div></div>
    ${gatherHtml(B)}
    <section class="group">`;
  B.tasks.forEach(t=>{
    const on = !!S.done[t[0]];
    h += `<label class="task ${on?"checked":""}"><input type="checkbox" data-id="${t[0]}" ${on?"checked":""}><div><div class="t">${esc(t[1])}</div>${t[2] ? `<div class="d">${esc(t[2])}</div>` : ""}</div></label>`;
  });
  h += `</section>`;
  if (B.startBtn) {
    h += S.startAt
      ? `<div class="note"><b>Clock started at ${fmt(S.startAt)}.</b> Times now follow your actual start. Reset to clear it.</div>`
      : `<button type="button" class="start" id="startBtn">Start the clock · bean pot is on</button>`
        + (S.target ? "" : `<div class="note"><b>Cooking to a time?</b> Tap Ready by at the top and every step gets a clock time.</div>`);
  }
  if (S.idx < BLOCKS.length-1) {
    const nx = BLOCKS[S.idx+1];
    h += `<div class="note"><b>Up next${nx.off!==null ? " at " + tabLabel(nx) : ": " + nx.label}:</b> ${esc(nx.headline)}</div>`;
  }
  main.innerHTML = h;
  const sb = document.getElementById("startBtn");
  if (sb) sb.onclick = ()=>{ S.startAt = Date.now(); go(S.idx+1); };
  document.getElementById("prev").disabled = S.idx===0;
  const nextBtn = document.getElementById("next");
  nextBtn.disabled = S.idx===BLOCKS.length-1;
  nextBtn.textContent = S.idx===BLOCKS.length-1 ? "Enjoy" : "Next · " + tabLabel(BLOCKS[S.idx+1]);
  document.getElementById("nowBtn").style.display = anchor() ? "" : "none";
  const rb = document.getElementById("readyBtn");
  rb.textContent = S.target ? "Ready " + fmt(S.target) : "Ready by";
  rb.classList.toggle("set", !!S.target);
  const bb = document.getElementById("batchBtn");
  bb.textContent = S.scale + "x batch";
  bb.classList.toggle("set", S.scale !== 1);
  const cur = tl.querySelector(".cur"); if (cur) cur.scrollIntoView({inline:"center", block:"nearest"});
}

function go(i){ S.idx = Math.max(0, Math.min(BLOCKS.length-1, i)); save(); render(); window.scrollTo(0,0); }

/* ============================================================
   Events
   ============================================================ */
document.getElementById("ingBtn").onclick = ()=>{ S.view = S.view === "ings" ? "plan" : "ings"; save(); render(); window.scrollTo(0,0); };
main.addEventListener("click", e=>{
  if (e.target.id === "backBtn") { S.view = "plan"; save(); render(); window.scrollTo(0,0); return; }
  const b = e.target.closest(".ilist .bopts button[data-k]"); if (!b) return;
  S.scale = +b.dataset.k; rebuild(); if (S.idx >= BLOCKS.length) S.idx = 0; save(); render();
});
tl.addEventListener("click", e=>{ const t = e.target.closest(".tl"); if (t) go(+t.dataset.i); });
main.addEventListener("change", e=>{
  const hv = e.target.closest("input[data-have]");
  if (hv) { if (hv.checked) S.have[hv.dataset.have] = true; else delete S.have[hv.dataset.have]; save(); const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  const c = e.target.closest("input[data-id]"); if (!c) return;
  if (c.checked) S.done[c.dataset.id] = true; else delete S.done[c.dataset.id];
  save(); const y = window.scrollY; render(); window.scrollTo(0,y);
});
document.getElementById("prev").onclick = ()=>go(S.idx-1);
document.getElementById("next").onclick = ()=>go(S.idx+1);
document.getElementById("nowBtn").onclick = ()=>{
  const a = anchor(); if (!a) return;
  const el = (Date.now() - a)/60000;
  if (el < -BRINE_MIN) return go(0);
  if (el < 0) return go(1);
  let pick = 2;
  BLOCKS.forEach((b,i)=>{ if (b.off!==null && el >= b.off) pick = i; });
  go(pick);
};

/* reset */
const modal = document.getElementById("modal");
document.getElementById("resetBtn").onclick = ()=>modal.classList.add("open");
document.getElementById("mCancel").onclick = ()=>modal.classList.remove("open");
document.getElementById("mOk").onclick = ()=>{ S = { idx:0, done:{}, startAt:null, target:null, scale:S.scale, view:"plan", have:{} }; save(); modal.classList.remove("open"); render(); };

/* ready by */
const rmodal = document.getElementById("rmodal"), rtime = document.getElementById("rtime");
document.getElementById("readyBtn").onclick = ()=>{
  const d = S.target ? new Date(S.target) : new Date(Date.now() + 3*3600000);
  rtime.value = String(d.getHours()).padStart(2,"0") + ":" + String(Math.floor(d.getMinutes()/5)*5).padStart(2,"0");
  document.getElementById("rhint").textContent = `Every step gets a real clock time, counted back from this. Day-of time for a ${S.scale}x batch is ${fmtDur(TOTAL)}, plus an 8 to 12 hour brine the night before.`;
  rmodal.classList.add("open"); rtime.focus();
};
document.getElementById("rSave").onclick = ()=>{
  if (!rtime.value) return;
  const [h,m] = rtime.value.split(":").map(Number);
  const t = new Date(); t.setHours(h,m,0,0);
  if (t.getTime() <= (S.startAt || Date.now())) t.setDate(t.getDate()+1);
  S.target = t.getTime(); save(); rmodal.classList.remove("open"); render();
};
document.getElementById("rClear").onclick = ()=>{ S.target = null; save(); rmodal.classList.remove("open"); render(); };

/* batch */
const bmodal = document.getElementById("bmodal"), bopts = document.getElementById("bopts");
function renderBatch(){
  bopts.innerHTML = SCALES.map(k=>`<button type="button" class="${k===S.scale?"on":""}" data-k="${k}">${k}x</button>`).join("");
  const k = S.scale;
  document.getElementById("bhint").textContent =
    `${amount("beans",k).replace(/ \(.*/,"")} dry beans, ${amount("beef",k)} each of beef and pork. Serves about ${Math.round(BASE_SERVINGS*k)}. Day-of time ${fmtDur(TOTAL)}.` +
    (k > 1 ? " Chipotle and salt scale at 75% so you can correct at the end. Meat browns in batches at 2x and up." : "");
}
document.getElementById("batchBtn").onclick = ()=>{ renderBatch(); bmodal.classList.add("open"); };
bopts.addEventListener("click", e=>{
  const b = e.target.closest("button[data-k]"); if (!b) return;
  S.scale = +b.dataset.k; rebuild(); if (S.idx >= BLOCKS.length) S.idx = 0; save(); renderBatch(); render();
});
document.getElementById("bDone").onclick = ()=>bmodal.classList.remove("open");

document.addEventListener("keydown", e=>{ if (e.key==="Escape") [modal, rmodal, bmodal].forEach(m=>m.classList.remove("open")); });

rebuild();
render();
</script>
</body>
</html>
